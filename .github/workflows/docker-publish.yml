# Builds the Docker image on every push to main and publishes it to GitHub Container Registry (GHCR).
# Azure Container Apps then pulls ghcr.io/<owner>/<repo>:latest (see DEPLOY_AZURE.md).
name: build-and-publish-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d -p 8501:8501 --name app ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do curl -fs http://localhost:8501/_stcore/health && exit 0; sleep 3; done
          docker logs app; exit 1
